<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop C'Bon – Popcorn béninois</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #FFF8F0;
            color: #2D1B0E;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0 1.5rem;
            border-bottom: 3px dashed #FCD116;
            margin-bottom: 2rem;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: #E8112D;
            text-shadow: 2px 2px 0 #FCD116;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .logo span {
            background: #00853E;
            color: white;
            font-size: 1.2rem;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            text-shadow: none;
        }

        /* ===== PANIER FIXE ===== */
        .cart-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: #E8112D;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(232, 17, 45, 0.4);
            transition: transform 0.3s, background 0.3s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .cart-btn:hover {
            transform: scale(1.08);
            background: #c00e24;
        }

        .cart-btn .badge-cart {
            background: #FCD116;
            color: #2D1B0E;
            border-radius: 50%;
            padding: 0 0.6rem;
            font-size: 0.9rem;
            min-width: 1.6rem;
            text-align: center;
        }

        /* ===== NAV ===== */
        nav {
            display: flex;
            gap: 1.8rem;
            font-weight: 600;
        }

        nav a {
            text-decoration: none;
            color: #2D1B0E;
            transition: color 0.3s;
            cursor: pointer;
        }

        nav a:hover {
            color: #E8112D;
        }

        /* ===== PAGES ===== */
        .page {
            display: block;
        }

        .page.hidden {
            display: none;
        }

        /* ===== HERO ===== */
        .hero {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2rem;
            padding: 2rem 0;
            margin-bottom: 3rem;
        }

        .hero-text {
            flex: 1 1 300px;
        }

        .hero-text h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            line-height: 1.1;
            color: #E8112D;
        }

        .hero-text h1 .highlight {
            color: #00853E;
            background: #FCD116;
            padding: 0 0.4rem;
            border-radius: 16px 4px 16px 4px;
            display: inline-block;
        }

        .hero-text p {
            font-size: 1.25rem;
            margin: 1.2rem 0;
        }

        .slogan {
            font-weight: 700;
            background: #FCD116;
            display: inline-block;
            padding: 0.4rem 1.8rem;
            border-radius: 40px;
        }

        .btn {
            display: inline-block;
            margin-top: 1.2rem;
            background: #E8112D;
            color: white;
            padding: 0.9rem 2.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 6px 0 #a00d1f;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(232, 17, 45, 0.35);
        }

        .hero-image {
            flex: 1 1 300px;
            display: flex;
            justify-content: center;
        }

        .popcorn-illustration {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle at 30% 30%, #FCD116, #e6b800);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-16px); }
            100% { transform: translateY(0px); }
        }

        /* ===== SECTION TITRE ===== */
        .section-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.8rem;
            text-align: center;
            color: #00853E;
            margin: 3rem 0 1rem;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 5px;
            background: #FCD116;
            margin: 0.5rem auto 0;
            border-radius: 10px;
        }

        /* ===== GRILLE 2x2 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin: 2rem 0 3rem;
        }

        /* ===== CARTES ===== */
        .card {
            background: white;
            border-radius: 24px;
